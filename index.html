<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1AA3B5" />
    <title>NCLEX-RN</title>
    <script>
      /* theme BEFORE first paint (saved choice, else the phone's setting) */
      try {
        var t = localStorage.getItem("nclex:theme");
        if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    </script>
    <style>
      /* Critical CSS: the very first frame is the branded splash (same colours as the native launch screen),
         so there is never a white flash or a fallback-font flash while Cairo + saved data load. */
      html, body { margin: 0; background: #1AA3B5; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: linear-gradient(135deg, #13A394 0%, #2AA4E6 100%); }
      #splash svg { width: 150px; height: auto; overflow: visible; }
      #splash path { fill: none; stroke: #FFCA3A; stroke-width: 36; stroke-linecap: round; stroke-linejoin: round; }
      #splash small { position: absolute; bottom: 14%; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.9); font: 600 14px system-ui, sans-serif; opacity: 0; transition: opacity .3s; padding: 0 24px; }
      #splash.slow small { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="230 300 570 270"><path d="M250 430H425L470 328L530 545L580 430H640L700 372L745 430H775" /></svg>
      <small>التطبيق بياخد وقت أطول من المعتاد… لو فضل كده اقفله وافتحه تاني</small>
    </div>
    <div id="root"></div>
    <script>setTimeout(function () { var s = document.getElementById("splash"); if (s) s.className += " slow"; }, 9000);</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
