<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EFF6F4" />
    <title>NCLEX-RN</title>
    <script>
      /* theme BEFORE first paint (saved choice, else the phone's setting) */
      try {
        var t = localStorage.getItem("nclex:theme");
        if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    </script>
    <style>
      /* No logo / picture on start-up: the very first frame is just the app's own page colour (light or dark),
         so the app simply appears. The cover below only exists to hide the half-loaded page for a split second. */
      html, body { margin: 0; background: #EFF6F4; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #061317; }
      #splash { position: fixed; inset: 0; z-index: 9999; background: #EFF6F4; }
      html[data-theme="dark"] #splash { background: #061317; }
      #splash small { position: absolute; bottom: 14%; left: 0; right: 0; text-align: center; color: #5B7A80; font: 600 14px system-ui, sans-serif; opacity: 0; transition: opacity .3s; padding: 0 24px; }
      #splash.slow small { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <small>التطبيق بياخد وقت أطول من المعتاد… لو فضل كده اقفله وافتحه تاني</small>
    </div>
    <div id="root"></div>
    <script>setTimeout(function () { var s = document.getElementById("splash"); if (s) s.className += " slow"; }, 9000);</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
